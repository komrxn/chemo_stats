[tool.poetry]
name = "kkh-analysis-backend"
version = "2.0.0"
description = "FastAPI backend for ANOVA & PCA statistical analysis with AI assistant"
authors = ["KKH Team"]
readme = "README.md"
packages = [{include = "services"}, {include = "utils"}, {include = "rag"}]

[tool.poetry.dependencies]
python = "^3.11"
# Web Framework
# Web Framework
fastapi = "0.115.0"
uvicorn = {extras = ["standard"], version = "0.32.0"}
python-multipart = "0.0.12"
email-validator = "^2.1.0.post1"

# Database & Auth
sqlmodel = "^0.0.16"
psycopg2-binary = "^2.9.9"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

# Data Processing
numpy = "1.26.4"  # FAISS requires NumPy 1.x
pandas = "2.2.3"
openpyxl = "3.1.5"

# Statistical Analysis
scipy = "1.14.1"
scikit-learn = "1.5.2"
statsmodels = "0.14.4"

# Logging & Utilities
python-json-logger = "3.1.0"
python-dotenv = "1.0.0"

# AI Assistant
openai = "1.40.0"
httpx = "0.27.2"
redis = "5.0.1"

# Audio processing
pydub = "0.25.1"

# RAG (Retrieval Augmented Generation)
faiss-cpu = "1.8.0"
PyPDF2 = "3.0.1"
python-docx = "1.1.0"
tiktoken = "0.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "uvicorn app:app --host 0.0.0.0 --port 8000"
test = "python run_tests.py"
setup-rag = "python setup_rag.py"
